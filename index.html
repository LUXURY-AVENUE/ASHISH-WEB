<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Trading Terminal | Chartink Real-Time</title>
    <style>
        :root {
            --bg-color: #090c10;
            --card-bg: #161b22;
            --border: #30363d;
            --accent: #58a6ff;
            --green: #238636;
            --red: #da3633;
        }

        body {
            background-color: var(--bg-color);
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            overflow: hidden; /* Screen fit rakhne ke liye */
        }

        /* Header */
        .top-nav {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 40px;
        }

        .logo { font-weight: bold; color: var(--accent); letter-spacing: 1px; }

        /* Dashboard Layout */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 320px;
            height: calc(100vh - 60px);
        }

        /* Real Chart Section */
        .chart-container {
            border-right: 1px solid var(--border);
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Sidebar Section */
        .sidebar {
            padding: 15px;
            background: var(--card-bg);
            overflow-y: auto;
        }

        .box {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 15px;
        }

        h3 { margin: 0 0 10px 0; font-size: 14px; color: var(--accent); text-transform: uppercase; }

        /* Option Chain Table */
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { padding: 8px 4px; text-align: center; border-bottom: 1px solid var(--border); }
        .strike { font-weight: bold; color: #fff; background: #21262d; }
        .ce { color: var(--green); font-weight: bold; }
        .pe { color: var(--red); font-weight: bold; }

        .refresh-btn {
            width: 100%;
            padding: 10px;
            background: var(--green);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="logo">PRO-TRADE LIVE</div>
        <div id="clock" style="font-family: monospace;">Loading...</div>
    </div>

    <div class="dashboard">
        <!-- Direct Chartink Link Section -->
        <div class="chart-container">
            <iframe 
                src="https://chartink.com/stocks-new?symbol=NIFTY" 
                title="Chartink Live Chart">
            </iframe>
        </div>

        <!-- Sidebar for Analysis & Strikes -->
        <div class="sidebar">
            
            <div class="box">
                <h3>Live Nifty Analysis</h3>
                <div style="display: flex; justify-content: space-between;">
                    <span>PCR: <b style="color: var(--green);">1.05</b></span>
                    <span>Trend: <b style="color: var(--accent);">Sideways</b></span>
                </div>
            </div>

            <div class="box">
                <h3>Strike Price (Watchlist)</h3>
                <table>
                    <thead>
                        <tr>
                            <th>CE LTP</th>
                            <th>STRIKE</th>
                            <th>PE LTP</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="ce">142.50</td>
                            <td class="strike">24200</td>
                            <td class="pe">18.40</td>
                        </tr>
                        <tr>
                            <td class="ce">85.10</td>
                            <td class="strike">24300</td>
                            <td class="pe">45.20</td>
                        </tr>
                        <tr>
                            <td class="ce">38.40</td>
                            <td class="strike">24400</td>
                            <td class="pe">98.15</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <button class="refresh-btn" onclick="location.reload();">Refresh Dashboard</button>
            
            <p style="font-size: 11px; color: #8b949e; margin-top: 15px; line-height: 1.4;">
                *Note: Chartink data is real-time. Strike prices are indicative. Use your broker terminal for execution.
            </p>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-IN', {timeZone: 'Asia/Kolkata'});
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>

</body>
</html>
