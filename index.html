<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSE Live Option Chain Terminal</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --accent: #58a6ff;
            --green: #238636;
            --red: #da3633;
        }

        body {
            background-color: var(--bg);
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header Section */
        .header {
            background: var(--card);
            padding: 10px 20px;
            border-bottom: 2px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 400px; /* Chart left, Chain right */
            flex: 1;
            overflow: hidden;
        }

        .chart-frame, .option-chain-frame {
            border: 1px solid var(--border);
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .main-layout { grid-template-columns: 1fr; }
            .option-chain-frame { height: 500px; }
        }

        .btn-link {
            background: var(--accent);
            color: white;
            padding: 5px 15px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin:0; font-size: 18px;">LIVE TRADING TERMINAL</h2>
        <a href="https://www.nseindia.com/option-chain" target="_blank" class="btn-link">Open Official NSE Chain</a>
    </div>

    <div class="main-layout">
        <!-- Section 1: Real Chartink Chart -->
        <div class="chart-frame">
            <iframe src="https://chartink.com/stocks-new?symbol=NIFTY" title="Live Chart"></iframe>
        </div>

        <!-- Section 2: Option Chain Mirror (Jugad Link) -->
        <div class="option-chain-frame">
            <!-- NSE Direct Iframe block karta hai, isliye hum ek third-party free 
                 Option Chain widget use kar rahe hain jo NSE se link hai -->
            <iframe 
                src="https://www.tradingview.com/symbols/NSE-NIFTY/option-chain/" 
                title="Live Option Chain">
            </iframe>
        </div>
    </div>

    <script>
        console.log("Terminal Ready - NSE Data Link Integrated");
    </script>
</body>
</html>
