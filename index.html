<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Mother's Day | DJ BEATS Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-light: #ffafcc;
            --pink-dark: #ff5c8a;
            --gold: #d4af37;
            --deep-red: #800f2f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #fff5f7;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            color: var(--deep-red);
        }

        /* Animated Soft Background */
        .bg-animate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #fff0f3, #ffccd5);
            z-index: -2;
        }

        /* Particles Layer */
        #particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        /* DJ BEATS Logo */
        .dj-logo {
            font-size: 1.2rem;
            font-weight: bold;
            background: linear-gradient(45deg, var(--deep-red), var(--pink-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            border: 2px solid var(--pink-dark);
            display: inline-block;
            padding: 5px 20px;
            border-radius: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(255, 92, 138, 0.2);
        }

        /* Smart Headline */
        .headline {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: var(--pink-dark);
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px rgba(255,255,255,1), 4px 4px 10px rgba(0,0,0,0.1);
        }

        /* Center Image (The one you uploaded) */
        .user-image-frame {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 40px auto;
            border-radius: 50%;
            padding: 10px;
            background: linear-gradient(45deg, var(--gold), var(--pink-light));
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            animation: float 4s ease-in-out infinite;
        }

        .user-image-frame img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid white;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* Shayari Cards */
        .shayari-container {
            display: grid;
            gap: 20px;
            margin: 50px 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 175, 204, 0.5);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        .card:hover { transform: scale(1.02); background: white; }

        .shayari-text {
            font-size: 1.4rem;
            line-height: 1.6;
            font-weight: 600;
            color: var(--deep-red);
        }

        /* Cartoon Gallery */
        .cartoon-gallery {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .cartoon-gallery img {
            width: 120px;
            height: 120px;
            border-radius: 15px;
            filter: grayscale(20%);
            transition: 0.3s;
        }
        .cartoon-gallery img:hover { filter: grayscale(0%); transform: rotate(5deg); }

        footer {
            margin-top: 60px;
            font-size: 0.9rem;
            color: #999;
            letter-spacing: 1px;
        }

        /* Floating Hearts Animation */
        .heart {
            position: fixed;
            color: var(--pink-dark);
            font-size: 20px;
            pointer-events: none;
            animation: moveUp 6s linear infinite;
            z-index: 99;
        }

        @keyframes moveUp {
            from { transform: translateY(100vh) scale(0); opacity: 1; }
            to { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

    </style>
</head>
<body>

    <div class="bg-animate"></div>
    <div id="particles"></div>

    <div class="container">
        <div class="dj-logo">DJ BEATS PREMIUM</div>

        <h1 class="headline">Happy Mother's Day</h1>
        <p style="font-weight: 300; letter-spacing: 3px;">MAA: THE HEART OF THE HOME</p>

        <div class="user-image-frame">
            <img src="Screenshot_20260510-155103.jpg" alt="Special Memory">
        </div>

        <div class="shayari-container">
            <div class="card">
                <p class="shayari-text">
                    "Labon pe uske kabhi baddua nahi hoti,<br>
                    Bas ek MAA hi hai jo kabhi khafa nahi hoti."
                </p>
            </div>
            
            <div class="card">
                <p class="shayari-text">
                    "Dawa jab asar na kare,<br>
                    toh ye MAA ki nazar utarti hai."
                </p>
            </div>
        </div>

        <div class="cartoon-gallery">
            <img src="https://img.freepik.com/free-vector/mother-hugging-her-child_23-2148476251.jpg" alt="Maa Cartoon">
            <img src="https://img.freepik.com/free-vector/hand-drawn-mother-s-day-illustration_23-2148895085.jpg" alt="Maa Cartoon">
            <img src="https://img.freepik.com/free-vector/flat-design-mother-s-day-illustration_23-2148897582.jpg" alt="Maa Cartoon">
        </div>

        <footer>
            DESIGNED BY DEVELOPER ASHISH FOR DJ BEATS &copy; 2026
        </footer>
    </div>

    <script>
        // Floating Hearts Logic
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 3 + 3 + "s";
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(createHeart, 400);
    </script>
</body>
</html>
