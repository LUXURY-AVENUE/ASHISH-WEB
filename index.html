
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ BEAT GROUP | Gaming Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay" id="gameOverlay">
        <div class="modal">
            <h2 id="modalTitle">Game Over</h2>
            <p id="modalScore">Score: 0</p>
            <button onclick="resetGame()">Play Again</button>
            <button onclick="closeGame()">Back to Home</button>
        </div>
    </div>

    <header>
        <div class="logo">DJ BEAT 🎧</div>
        <div class="stats">Top Score: <span id="topScore">0</span></div>
    </header>

    <main id="homeScreen">
        <h1>Select a Game</h1>
        <div class="grid">
            <div class="card" onclick="startSnake()">
                <div class="icon">🐍</div>
                <h3>Neon Snake</h3>
                <p>Classic arcade fun.</p>
            </div>
            <div class="card locked">
                <div class="icon">❓</div>
                <h3>Quiz Battle</h3>
                <p>Coming Soon...</p>
            </div>
        </div>
    </main>

    <section id="gameArea" style="display: none;">
        <canvas id="snakeCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <p>Use Arrow Keys to Move</p>
            <button onclick="closeGame()">Exit Game</button>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
