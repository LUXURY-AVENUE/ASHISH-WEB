            transform: translateY(-10px) scale(1.02);
        }

        .glow-text { text-shadow: 0 0 10px rgba(255, 0, 85, 0.5); }
        .nav-blur { background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(15px); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #ff0055; border-radius: 10px; }
