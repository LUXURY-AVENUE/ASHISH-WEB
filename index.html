<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Delta Algo Trader - Ashish</title>
    <style>
        body { background: #0b0e11; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        .trading-panel { background: #181a20; padding: 20px; border-radius: 15px; border: 1px solid #333; width: 350px; margin: auto; }
        .price { font-size: 2.5rem; font-weight: bold; color: #f0b90b; margin: 10px 0; }
        .input-group { margin: 15px 0; text-align: left; }
        input { width: 90%; padding: 10px; background: #2b2f36; border: 1px solid #474d57; color: white; border-radius: 5px; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        .buy-btn { background: #02d39a; color: black; border: none; padding: 12px 30px; border-radius: 5px; font-weight: bold; cursor: pointer; flex: 1; }
        .sell-btn { background: #f6465d; color: white; border: none; padding: 12px 30px; border-radius: 5px; font-weight: bold; cursor: pointer; flex: 1; }
        #log { margin-top: 20px; font-size: 0.8rem; color: #848e9c; }
    </style>
</head>
<body>

    <h2>Delta Live Trading Terminal</h2>

    <div class="trading-panel">
        <div style="font-size: 0.9rem; color: #848e9c;">BTC-USD Live Price</div>
        <div id="live-price" class="price">Connecting...</div>

        <div class="input-group">
            <label>Quantity (Contracts):</label><br>
            <input type="number" id="qty" value="1">
        </div>

        <div class="btn-group">
            <button class="buy-btn" onclick="placeOrder('buy')">BUY / LONG</button>
            <button class="sell-btn" onclick="placeOrder('sell')">SELL / SHORT</button>
        </div>
        
        <div id="log">Status: Ready</div>
    </div>

    <script>
        const API_KEY = "myIGwx6BwEMz7eUO2QB4TJcTUcBnMw"; // आपकी Key
        const logElement = document.getElementById('log');

        // लाइव प्राइस अपडेट के लिए WebSocket (पिछले कोड जैसा)
        const socket = new WebSocket('wss://socket.india.delta.exchange');
        socket.onopen = () => {
            socket.send(JSON.stringify({"type": "subscribe","payload": {"channels": [{"name": "v2/ticker","symbols": ["BTCUSD"]}]}}));
        };
        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.last_price) document.getElementById('live-price').innerText = "$" + data.last_price;
        };

        // ऑर्डर पंच करने का फंक्शन
        async function placeOrder(side) {
            const quantity = document.getElementById('qty').value;
            logElement.innerText = `Status: Sending ${side.toUpperCase()} order...`;

            // ध्यान दें: असल ट्रेडिंग के लिए 'Signature' जनरेट करना पड़ता है।
            // डेल्टा की API बिना सिग्नेचर के आर्डर नहीं लेगी।
            // यह एक स्ट्रक्चर है जो आपकी रिक्वेस्ट भेजेगा:
            
            const orderData = {
                "product_id": 1, // BTCUSD का ID (डेल्टा के हिसाब से बदलें)
                "size": parseInt(quantity),
                "side": side === 'buy' ? 'buy' : 'sell',
                "order_type": "market"
            };

            try {
                const response = await fetch('https://api.india.delta.exchange/v2/orders', {
                    method: 'POST',
                    headers: {
                        'api-key': API_KEY,
                        'Content-Type': 'application/json'
                        // यहाँ 'api-signature' और 'api-expires' हेडर भी चाहिए होंगे
                    },
                    body: JSON.stringify(orderData)
                });

                const result = await response.json();
                if(result.success) {
                    logElement.innerText = "Status: Order Placed Successfully!";
                    logElement.style.color = "#02d39a";
                } else {
                    logElement.innerText = "Error: " + result.error.message;
                    logElement.style.color = "#f6465d";
                }
            } catch (err) {
                logElement.innerText = "Status: Connection Error (Check IP Whitelist)";
            }
        }
    </script>
</body>
</html>
