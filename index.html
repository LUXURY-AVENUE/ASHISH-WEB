<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASHISH GAMING X | NEXT LEVEL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Rajdhani:wght@600;700&display=swap');
        
        body { background-color: #050505; color: #fff; font-family: 'Rajdhani', sans-serif; }
        .font-sync { font-family: 'Syncopate', sans-serif; }
        
        .gaming-card { 
            background: linear-gradient(160deg, #111, #000);
            border: 1px solid #222;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .gaming-card:hover { 
            border-color: #ff0055; 
            transform: translateY(-8px);
            box-shadow: 0 15px 50px -10px rgba(255, 0, 85, 0.4);
        }

        .neon-text { text-shadow: 0 0 15px rgba(255, 0, 85, 1); }
        .nav-glass { background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid #1a1a1a; }
        
        /* Next Level Animation */
        .glitch-effect {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.8; transform: scale(1.02); }
            100% { opacity: 1; }
        }
    </style>
</head>
<body class="pb-20">

    <nav class="nav-glass sticky top-0 z-[100] p-5">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-2xl font-sync tracking-tighter text-[#ff0055] neon-text italic uppercase">ASHISH GAMING X</span>
            </div>
            <a href="https://wa.me/917530919863" class="bg-[#ff0055] px-6 py-2 rounded-full font-bold text-xs shadow-lg shadow-pink-500/20 flex items-center gap-2">
                <i class="fab fa-whatsapp"></i> ORDER NOW
            </a>
        </div>
    </nav>

    <header class="py-16 text-center">
        <h2 class="text-6xl md:text-8xl font-bold font-sync uppercase tracking-tighter italic text-white glitch-effect">
            NEXT LEVEL <br> <span class="text-[#ff0055] neon-text">GAMING</span>
        </h2>
        <p class="mt-6 text-zinc-500 tracking-[0.5em] text-[10px] uppercase">Official Ashish X-Inventory • 7530919863</p>
    </header>

    <main class="max-w-7xl mx-auto px-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
        
        <script>
            const githubUser = "LUXURY-AVENUE"; 
            const repo = "ASHISH-WEB"; 

            const chairs = [
                { name: "Alpha Neon X", price: "14,500", img: "Screenshot_20260510-011529.jpg" },
                { name: "Stealth Knight", price: "18,900", img: "Screenshot_20260510-011511.jpg" },
                { name: "Titan Frost", price: "22,500", img: "Screenshot_20260510-011401.jpg" },
                { name: "Vulcan Magma", price: "19,200", img: "Screenshot_20260510-011427.jpg" },
                { name: "Carbon Fury", price: "26,000", img: "Screenshot_20260510-011344.jpg" },
                { name: "Empire Leather", price: "32,000", img: "Screenshot_20260510-011323.jpg" },
                { name: "Cyber Pulse", price: "16,800", img: "Screenshot_20260510-011240.jpg" },
                { name: "God Mode V1", price: "45,000", img: "Screenshot_20260510-011257.jpg" },
                { name: "Rogue Shadow", price: "21,000", img: "Screenshot_20260510-011220.jpg" },
                { name: "Neon Spectrum", price: "23,800", img: "Screenshot_20260510-011159.jpg" }
            ];

            const container = document.currentScript.parentElement;
            
            chairs.forEach((chair) => {
                const imgPath = `https://raw.githubusercontent.com/${githubUser}/${repo}/main/${chair.img}`;

                container.innerHTML += `
                    <div class="gaming-card p-4 rounded-[2rem] flex flex-col justify-between overflow-hidden">
                        <div>
                            <div class="h-64 rounded-[1.5rem] overflow-hidden bg-zinc-900 mb-5 flex items-center justify-center border border-zinc-800 relative">
                                <img src="${imgPath}" class="w-full h-full object-cover hover:scale-110 transition duration-700" alt="${chair.name}" />
                            </div>
                            <div class="px-2 text-center">
                                <h4 class="text-xl font-bold font-sync text-white uppercase italic tracking-tighter">${chair.name}</h4>
                            </div>
                        </div>
                        <div class="mt-8 px-2">
                            <div class="text-center mb-5">
                                <p class="text-[9px] text-zinc-500 uppercase">OFFICIAL PRICE</p>
                                <p class="text-3xl font-black italic tracking-tighter text-white">₹${chair.price}</p>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <a href="upi://pay?pa=7530919863@paytm&pn=AshishGamingX&am=${chair.price.replace(',', '')}&cu=INR" 
                                   class="bg-white text-black text-[10px] font-bold py-4 rounded-xl text-center hover:bg-[#ff0055] hover:text-white transition-all uppercase tracking-widest">Pay UPI</a>
                                <a href="https://wa.me/917530919863?text=Order: ${chair.name}" 
                                   class="border border-zinc-800 text-white text-[10px] font-bold py-4 rounded-xl text-center hover:border-zinc-500 transition-all uppercase tracking-widest">WhatsApp</a>
                            </div>
                        </div>
                    </div>
                `;
            });
        </script>
    </main>

</body>
</html>
