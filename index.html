<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub | Unlimited Movies</title>
    <style>
        /* Design aur Styling */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Scrollbar hatane ke liye */
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Loading Animation */
        .loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e50914; /* Netflix Red style */
            font-size: 24px;
            font-weight: bold;
            z-index: -1;
        }

        /* Movie Player Container */
        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Top Bar for Professional Look */
        .header-overlay {
            position: fixed;
            top: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
            z-index: 10;
            display: flex;
            align-items: center;
            padding-left: 20px;
            pointer-events: none; /* User niche click kar sake */
        }

        .logo {
            color: #e50914;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="loader">Loading Magic...</div>

    <div class="header-overlay">
        <div class="logo">STREAM HUB</div>
    </div>

    <div class="video-container">
        <!-- Aapka source link yahan embed ho raha hai -->
        <iframe 
            src="https://net22.cc/home" 
            allowfullscreen="true" 
            webkitallowfullscreen="true" 
            mozallowfullscreen="true" 
            sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation">
        </iframe>
    </div>

</body>
</html>
