<!DOCTYPE html>
<html lang="hi">
<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Rajdhani:wght@600;700&display=swap');
        
        body { background-color: #050505; color: #fff; font-family: 'Rajdhani', sans-serif; }
        .font-sync { font-family: 'Syncopate', sans-serif; }
        
        .gaming-card { 
            background: linear-gradient(160deg, #111, #000);
            border: 1px solid #222;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .gaming-card:hover { 
            border-color: #ff0055; 
            transform: scale(1.05) translateY(-10px);
            box-shadow: 0 20px 60px -15px rgba(255, 0, 85, 0.5);
        }

        .neon-text { text-shadow: 0 0 10px rgba(255, 0, 85, 0.8); }
        .gradient-bg { background: linear-gradient(90deg, #ff0055, #7000ff); }
        .nav-glass { background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid #1a1a1a; }
    </style>
</head>
<body class="pb-20">

    <nav class="nav-glass sticky top-0 z-[100] p-5">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-2xl font-sync tracking-tighter text-[#ff0055] neon-text italic uppercase">ASHISH GAMING X</span>

        <p class="mt-4 text-zinc-500 tracking-[0.5em] text-[10px] uppercase">Official Ashish Gaming X Inventory</p>
    </header>

    <main class="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10">
        
        <script>
            // आपके GitHub से फोटो लोड करने के लिए सेटिंग
            const githubUser = "LUXURY-AVENUE"; // यहाँ अपना GitHub यूजरनेम कन्फर्म करें
            const repo = "ASHISH-WEB"; 

            const chairs = [
                { name: "Alpha Neon X", price: "14,500", img: "Screenshot_20260510-011529.jpg" },
                { name: "Stealth Knight", price: "18,900", img: "Screenshot_20260510-011511.jpg" },
                { name: "Titan Frost", price: "22,500", img: "Screenshot_20260510-011401.jpg" },
                { name: "Vulcan Magma", price: "19,200", img: "Screenshot_20260510-011427.jpg" },
                { name: "Carbon Fury", price: "26,000", img: "Screenshot_20260510-011344.jpg" },
                { name: "Empire Leather", price: "32,000", img: "Screenshot_20260510-011323.jpg" },
                { name: "Cyber Pulse", price: "16,800", img: "Screenshot_20260510-011240.jpg" },
                { name: "God Mode V1", price: "45,000", img: "Screenshot_20260510-011257.jpg" },
                { name: "Rogue Shadow", price: "21,000", img: "Screenshot_20260510-011220.jpg" },
                { name: "Neon Spectrum", price: "23,800", img: "Screenshot_20260510-011159.jpg" }
            ];

            const container = document.currentScript.parentElement;
            
            chairs.forEach((chair) => {
                // GitHub Raw Image URL बनाना
                const imgPath = `https://raw.githubusercontent.com/${githubUser}/${repo}/main/${chair.img}`;

                container.innerHTML += `
                    <div class="gaming-card p-5 rounded-[2.5rem] flex flex-col justify-between overflow-hidden">
                        <div>
                            <div class="h-64 rounded-[2rem] overflow-hidden bg-zinc-900 mb-6 flex items-center justify-center border border-zinc-800">
                                <img src="${imgPath}" class="w-full h-full object-cover hover:scale-110 transition duration-700" alt="${chair.name}" onerror="this.src='https://via.placeholder.com/400x400/111/ff0055?text=Image+Loading...'"/>
                            </div>
                            <div class="px-2 text-center">
                                <h4 class="text-xl font-bold font-sync text-white uppercase italic tracking-tighter">${chair.name}</h4>
                                <p class="text-[10px] text-zinc-500 mt-2 uppercase tracking-[0.2em]">X-Series Edition</p>
                            </div>
                        </div>
                        <div class="mt-8 px-2">

                                <p class="text-[9px] text-zinc-500 uppercase">PRICE</p>
                                <p class="text-3xl font-black italic tracking-tighter">₹${chair.price}</p>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <a href="upi://pay?pa=7530919863@paytm&pn=AshishGamingX&am=${chair.price.replace(',', '')}&cu=INR" 
                                   class="bg-white text-black text-[10px] font-bold py-4 rounded-xl text-center hover:bg-[#ff0055] hover:text-white transition-all uppercase tracking-widest">Pay UPI</a>
                                <a href="https://wa.me/917530919863?text=Interested in: ${chair.name}" 
                                   class="border border-zinc-800 text-white text-[10px] font-bold py-4 rounded-xl text-center hover:border-zinc-500 transition-all uppercase tracking-widest">WhatsApp</a>
                            </div>
                        </div>
                    </div>
                `;
            });
        </script>
    </main>

    <footer class="mt-40 p-20 border-t border-zinc-900 text-center">
        <h2 class="text-2xl font-sync italic text-[#ff0055] neon-text">ASHISH GAMING X CHAIRS</h2>
        <p class="text-zinc-600 text-[10px] mt-4 tracking-[0.5em] uppercase">Engineered for Dominance • 7530919863</p>
    </footer>

</body>
</html>
