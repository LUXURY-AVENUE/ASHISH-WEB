<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANN News | Live updates</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .breaking-news-gradient {
            background: linear-gradient(90deg, #d20000 0%, #ff0000 100%);
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <header class="bg-white border-b sticky top-0 z-50">
        <div class="flex items-center justify-between px-4 py-2 border-b">
            <i class="fa-solid fa-house text-red-600 text-xl"></i>
            <div class="flex-1 mx-4">
                <div class="bg-gray-200 rounded-full flex items-center px-4 py-1">
                    <i class="fa-solid fa-magnifying-glass text-gray-500 mr-2"></i>
                    <input type="text" placeholder="annnews.in" class="bg-transparent outline-none w-full text-sm">
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <span class="bg-gray-200 rounded px-2 text-sm font-bold">:D</span>
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </div>
        </div>
        
        <nav class="flex items-center justify-between px-4 py-2">
            <div class="bg-red-700 text-white px-2 py-1 font-bold text-xl italic">
                ANN <span class="text-white font-normal">न्यूज़</span>
            </div>
            <div class="flex space-x-4 overflow-x-auto text-sm font-semibold whitespace-nowrap scrollbar-hide">
                <a href="#" class="text-red-600">ई-पेपर</a>
                <a href="#">बाकी</a>
                <a href="#">वीडियो</a>
                <a href="#">चुनाव 2026</a>
            </div>
            <div class="bg-red-600 text-white rounded-full p-2">
                <i class="fa-solid fa-user"></i>
            </div>
        </nav>
    </header>

    <div class="breaking-news-gradient text-white flex">
        <div class="bg-red-900 px-4 py-3 font-black italic flex items-center leading-tight">
            BREAKING <br> NEWS
        </div>
        <div class="px-4 py-3 flex-1 font-bold text-lg">
            IRCTC घोटाले में बड़ी खबर: ANN न्यूज़ पर आज बड़ा फैसला संभव
        </div>
    </div>

    <div class="flex space-x-2 p-4 overflow-x-auto">
        <button class="bg-white border rounded-lg px-4 py-2 text-sm font-bold shadow-sm whitespace-nowrap">उठो अनारकली</button>
        <button class="bg-white border rounded-lg px-4 py-2 text-sm font-bold shadow-sm whitespace-nowrap">विधानसभा चुनाव नतीजे 2026</button>
        <button class="bg-white border rounded-lg px-4 py-2 text-sm font-bold shadow-sm whitespace-nowrap">पीएम मोदी</button>
    </div>

    <div class="px-4">
        <p class="text-center text-xs text-gray-500 mb-1">ADVERTISEMENT</p>
        <div class="bg-blue-400 rounded-lg overflow-hidden relative">
            <img src="https://via.placeholder.com/600x400/22d3ee/ffffff?text=ANN+News+Ad+Banner" alt="Ad" class="w-full h-auto">
            <div class="absolute bottom-2 right-2 bg-gray-900/50 text-white text-[10px] px-1">AD</div>
        </div>
    </div>

    <div class="mt-6 px-4">
        <div class="bg-blue-900 text-white py-4 text-center rounded-t-xl">
            <h2 class="text-4xl font-black tracking-tighter">चुनाव 2026</h2>
        </div>
    </div>

    <footer class="mt-10 bg-gray-800 text-white py-6 text-center">
        <p class="text-lg font-bold">ANN NEWS</p>
        <p class="text-xs text-gray-400 mt-2">© 2026 All Rights Reserved</p>
        <div class="mt-4 bg-red-600 inline-block px-4 py-1 rounded text-sm font-mono tracking-widest uppercase">
            Developed by Ashish
        </div>
    </footer>

    <div class="fixed bottom-0 w-full bg-white border-t flex justify-around py-2 text-[10px] text-gray-600 font-bold">
        <div class="flex flex-col items-center text-red-600">
            <i class="fa-solid fa-house text-lg"></i>
            <span>होम</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fa-solid fa-circle-play text-lg"></i>
            <span>वीडियो</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fa-solid fa-tv text-lg text-red-600"></i>
            <span class="text-red-600 uppercase">Live TV</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fa-solid fa-film text-lg"></i>
            <span>न्यूज़ रील</span>
        </div>
        <div class="flex flex-col items-center">
            <i class="fa-solid fa-bars text-lg"></i>
            <span>मेन्यू</span>
        </div>
    </div>

    <div class="h-16"></div> </body>
</html>
